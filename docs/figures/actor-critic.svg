<?xml version='1.0' encoding='utf-8'?>
<svg viewBox="0 0 960 474" role="img" aria-labelledby="net-title net-desc" xmlns="http://www.w3.org/2000/svg" width="960" height="474">
  <title id="net-title">Actor and Critic architecture</title>
  <desc id="net-desc">Actor: four state inputs, normalized fully connected layers of 200 and 100 units with ReLU, then one capped output. Critic: a 4 to 200 to 100 state branch plus a 1 to 100 action branch, added before ReLU and a scalar Q output. Q gradients train the Actor. Normalization uses fixed statistics and learned affine parameters.</desc>
  <defs>
    <marker id="greenarrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7" fill="#007f73" />
    </marker>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7" fill="#526c76" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="474" fill="#ffffff" />
  <text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#18384b" letter-spacing=".07em" font-weight="700" x="22" y="28">B / ACTOR–CRITIC · ONE SHARED HOUSEHOLD POLICY</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#18384b" font-weight="700" x="24" y="65">Actor μ<tspan baseline-shift="sub" font-size="70%">θ</tspan></text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#536773" x="180" y="65">Deterministic capital-ratio policy</text>
  <rect x="24" y="85" width="104" height="68" rx="4" fill="#eef1ed" stroke="#cdd5d3" />
  <text font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#18384b" font-weight="700" x="76" y="111" text-anchor="middle">State s</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#536773" x="76" y="134" text-anchor="middle">4 features</text>
  <rect x="180" y="85" width="152" height="68" rx="4" fill="#e9f3ef" stroke="#a9cfc6" />
  <text font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#18384b" font-weight="700" x="256" y="111" text-anchor="middle">FC 4 → 200</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#536773" x="256" y="134" text-anchor="middle">FC → Norm → ReLU</text>
  <rect x="384" y="85" width="152" height="68" rx="4" fill="#e9f3ef" stroke="#a9cfc6" />
  <text font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#18384b" font-weight="700" x="460" y="111" text-anchor="middle">FC 200 → 100</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#536773" x="460" y="134" text-anchor="middle">FC → Norm → ReLU</text>
  <rect x="588" y="85" width="160" height="68" rx="4" fill="#e9f3ef" stroke="#a9cfc6" />
  <text font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#18384b" font-weight="700" x="668" y="111" text-anchor="middle">FC 100 → 1</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#536773" x="668" y="134" text-anchor="middle">FC → cap</text>
  <rect x="800" y="85" width="136" height="68" rx="4" fill="#18384b" />
  <text font-family="Arial, Helvetica, sans-serif" font-size="15" fill="white" font-weight="700" x="868" y="111" text-anchor="middle">a ∈ [0,1]</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#d3e0e4" x="868" y="134" text-anchor="middle">Capital: k′ = ak</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#18384b" letter-spacing=".07em" font-weight="700" x="149" y="106" text-anchor="middle">Norm</text>
  <path fill="none" stroke="#526c76" stroke-width="1.6" marker-end="url(#arrow)" d="M130 119H169" />
  <path fill="none" stroke="#526c76" stroke-width="1.6" marker-end="url(#arrow)" d="M334 119H373" />
  <path fill="none" stroke="#526c76" stroke-width="1.6" marker-end="url(#arrow)" d="M538 119H577" />
  <path fill="none" stroke="#526c76" stroke-width="1.6" marker-end="url(#arrow)" d="M750 119H789" />
  <text font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#18384b" font-weight="700" x="24" y="220">Critic Q<tspan baseline-shift="sub" font-size="70%">φ</tspan></text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#536773" x="180" y="220">Expected discounted utility of taking action a in state s</text>
  <rect x="24" y="242" width="104" height="68" rx="4" fill="#eef1ed" stroke="#cdd5d3" />
  <text font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#18384b" font-weight="700" x="76" y="270" text-anchor="middle">State s</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#536773" x="76" y="293" text-anchor="middle">4 features</text>
  <rect x="180" y="242" width="152" height="68" rx="4" fill="#eef1ed" stroke="#cdd5d3" />
  <text font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#18384b" font-weight="700" x="256" y="270" text-anchor="middle">FC 4 → 200</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#536773" x="256" y="293" text-anchor="middle">FC → Norm → ReLU</text>
  <rect x="384" y="242" width="152" height="68" rx="4" fill="#eef1ed" stroke="#cdd5d3" />
  <text font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#18384b" font-weight="700" x="460" y="270" text-anchor="middle">FC 200 → 100</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#536773" x="460" y="293" text-anchor="middle">FC → Norm</text>
  <rect x="180" y="348" width="152" height="62" rx="4" fill="#e9f3ef" stroke="#a9cfc6" />
  <text font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#18384b" font-weight="700" x="256" y="374" text-anchor="middle">Action a</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#536773" x="256" y="397" text-anchor="middle">Replay or Actor output</text>
  <rect x="384" y="348" width="152" height="62" rx="4" fill="#eef1ed" stroke="#cdd5d3" />
  <text font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#18384b" font-weight="700" x="460" y="374" text-anchor="middle">FC 1 → 100</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#536773" x="460" y="397" text-anchor="middle">FC → Norm</text>
  <circle cx="621" cy="276" r="22" fill="white" stroke="#526c76" />
  <text font-family="Arial, Helvetica, sans-serif" font-size="23px" fill="#18384b" x="621" y="283" text-anchor="middle">+</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#536773" x="660" y="324" text-anchor="middle">ReLU</text>
  <rect x="695" y="242" width="136" height="68" rx="4" fill="#eef1ed" stroke="#cdd5d3" />
  <text font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#18384b" font-weight="700" x="763" y="270" text-anchor="middle">FC 100 → 1</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#536773" x="763" y="293" text-anchor="middle">Linear output</text>
  <text font-family="Georgia, serif" font-size="18" fill="#18384b" x="897" y="283" text-anchor="middle">Q(s,a)</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#18384b" letter-spacing=".07em" font-weight="700" x="149" y="263" text-anchor="middle">Norm</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#18384b" letter-spacing=".07em" font-weight="700" x="354" y="366" text-anchor="middle">Norm</text>
  <path fill="none" stroke="#526c76" stroke-width="1.6" marker-end="url(#arrow)" d="M130 276H169" />
  <path fill="none" stroke="#526c76" stroke-width="1.6" marker-end="url(#arrow)" d="M334 276H373" />
  <path fill="none" stroke="#526c76" stroke-width="1.6" marker-end="url(#arrow)" d="M538 276H588" />
  <path fill="none" stroke="#526c76" stroke-width="1.6" marker-end="url(#arrow)" d="M334 379H373" />
  <path fill="none" stroke="#526c76" stroke-width="1.6" marker-end="url(#arrow)" d="M538 379H621V309" />
  <path fill="none" stroke="#526c76" stroke-width="1.6" marker-end="url(#arrow)" d="M645 276H684" />
  <path fill="none" stroke="#526c76" stroke-width="1.6" marker-end="url(#arrow)" d="M833 276H857" />
  <path fill="none" stroke="#007f73" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#greenarrow)" d="M902 244V186H668V164" />
  <text font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#007f73" x="720" y="178">∂Q/∂a trains the Actor</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#536773" x="24" y="448">Norm = fixed statistics, learned scale and bias. Cap = min(max(raw, 0), 2) / 2.</text>
</svg>
